name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: megacorps_test
          POSTGRES_PASSWORD: synthetic_ci_test_password
          POSTGRES_DB: megacorps_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U megacorps_test -d megacorps_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        env:
          TEST_DATABASE_URL: postgresql://megacorps_test:synthetic_ci_test_password@localhost:5432/megacorps_test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install browser for responsive UI tests
        run: npx playwright install --with-deps chromium

      - name: Responsive UI tests
        run: npm run test:e2e -w @megacorps/web
